<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <!-- Link the CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h2> My To-Do List</h2>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Enter your task here...">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>
        <!-- Unordered list to display the tasks -->
        <ul id="task1">QuickSort</ul>
		<ul id="task2">BubbleSort</ul>
		<ul id="task3">HeapSort</ul>
		<ul id="task4">MergeSort</ul>
    </div>
</body>
</html>
